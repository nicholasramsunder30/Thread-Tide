    <main>
        <h2>Send Us an Enquiry</h2>
        <p>Fill out the form below and we'll get back to you as soon as we can.</p>

        <form>
            <label for="fullname">Full Name</label><br>
            <input type="text" id="fullname" name="fullname"><br><br>

            <label for="email">Email Address</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="enquiryType">Enquiry Type</label><br>
            <select id="enquiryType" name="enquiryType">
                <option value="product">Product Question</option>
                <option value="order">Order / Delivery</option>
                <option value="returns">Returns and Exchanges</option>
                <option value="other">Other</option>
            </select><br><br>

            <label for="message">Message</label><br>
            <textarea id="message" name="message" rows="6" cols="40"></textarea><br><br>

            <button type="submit">Submit</button>
        </form>
    </main>
