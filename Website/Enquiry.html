<!DOCTYPE html>
<html>
<head>
    <title>Clothing Enquiries | Thread & Tide</title>
<meta name="description" content="Send Thread & Tide an enquiry about clothing products, orders, delivery, returns or exchanges. Our team is ready to assist you.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Thread & Tide</h1>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="About.html">About</a>
        <a href="Services.html">Services</a>
        <a href="Products.html">Products</a>
        <a href="Enquiry.html">Enquiry</a>
        <a href="Contact Us.html">Contact Us</a>
    </nav>
    <main>
        <h2>Send Us an Enquiry</h2>
        <p>Fill out the form below and we'll get back to you as soon as we can.</p>

        <form id="enquiryForm">

    <label for="fullname">Full Name</label>
    <input
        type="text"
        id="fullname"
        name="fullname"
        required
        minlength="2"
    >

    <label for="email">Email Address</label>
    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <label for="enquiryType">Enquiry Type</label>
    <select id="enquiryType" name="enquiryType" required>
        <option value="">Select an enquiry type</option>
        <option value="product">Product Question</option>
        <option value="order">Order / Delivery</option>
        <option value="returns">Returns and Exchanges</option>
        <option value="other">Other</option>
    </select>

    <label for="message">Message</label>
    <textarea
        id="message"
        name="message"
        rows="6"
        required
        minlength="10"
    ></textarea>

    <button type="submit">Submit Enquiry</button>

    <p id="enquiryFeedback" role="status"></p>

</form>
    </main>
    <footer>
        <p>&copy; 2026 Thread & Tide. All rights reserved.</p>
    </footer>
    <script src="enquiry.js"></script>
</body>
</html>
